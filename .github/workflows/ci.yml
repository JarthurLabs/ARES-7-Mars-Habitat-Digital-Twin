name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            simulator/package-lock.json
            functions/package-lock.json

      - name: Install viewer dependencies
        run: npm ci

      - name: Install simulator dependencies
        run: npm --prefix simulator ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Run all tests and builds
        run: npm run verify

      - name: Install Chromium for browser checks
        run: npx playwright install chromium --with-deps --only-shell

      - name: Verify desktop and mobile public demo
        run: npm run test:e2e

      - name: Verify Pages artifact boundary
        run: npm run pages:validate

      - name: Build core Bicep
        run: az bicep build --file infra/main.bicep --outfile /tmp/ares7-core.json

      - name: Build integration Bicep
        run: az bicep build --file infra/integration.bicep --outfile /tmp/ares7-integration.json

      - name: Verify compiled infrastructure controls
        run: node scripts/validate-infra.mjs /tmp/ares7-core.json /tmp/ares7-integration.json

      - name: Verify Azure deployment and cleanup guards
        run: node scripts/validate-azure-guards.mjs
